name: Setup app
description: PHP 8.5, Node, Composer + npm dependencies, environment and generated route helpers.

inputs:
  coverage:
    description: PHP coverage driver (none or xdebug).
    default: none
  build:
    description: >-
      'true' runs `npm run build` (a full Vite build, needed whenever a Blade view renders @vite).
      'false' only generates the Wayfinder route helpers that the JS type-check and lint need.
    default: 'true'

runs:
  using: composite
  steps:
    - name: Setup PHP
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
      with:
        php-version: '8.5'
        tools: composer:v2
        coverage: ${{ inputs.coverage }}

    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: '.nvmrc'

    - name: Cache Composer dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: vendor
        key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
        restore-keys: ${{ runner.os }}-composer-

    - name: Install Composer dependencies
      shell: bash
      run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-progress

    - name: Prepare environment
      shell: bash
      run: |
        cp .env.example .env
        php artisan key:generate

    - name: Cache npm dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: node_modules
        key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
        restore-keys: ${{ runner.os }}-npm-

    - name: Install npm dependencies
      shell: bash
      run: npm ci

    - name: Build assets
      if: inputs.build == 'true'
      shell: bash
      run: npm run build

    - name: Generate route helpers
      if: inputs.build != 'true'
      shell: bash
      run: php artisan wayfinder:generate --with-form
