name: lint

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # `composer test:composer`: composer validate --strict over app/ and packages/runner, including
    # that each composer.lock matches its composer.json.
    # `composer test:lint`: Pint + Rector (dry run) over app/ and packages/runner, plus
    # the vite-plus formatter and linter over the frontend.
    # `composer test:type-coverage`: Pest's 100% type-coverage gate over app/ and packages/runner.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup app
        uses: ./.github/actions/setup-app
        with:
          build: 'false'

      - name: Validate composer.json
        run: composer test:composer

      - name: Cache packages/runner Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/runner/vendor
          key: ${{ runner.os }}-composer-runner-8.5-${{ hashFiles('packages/runner/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-runner-8.5-

      - name: Install packages/runner Composer dependencies
        # `composer test:lint` / `test:type-coverage` descend into packages/runner, which runs
        # its own Pint, Rector and Pest binaries from this vendor dir.
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-progress --working-dir=packages/runner

      # As in https://getrector.com/documentation/cache-in-ci: cache entries cannot be updated, so
      # each run saves under its own key, also after a failing lint, and restore-keys loads the
      # most recent one.
      - name: Restore Rector cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /tmp/rector
            /tmp/rector-runner
          key: ${{ runner.os }}-rector-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-rector-

      - name: Lint
        run: composer test:lint

      - name: Save Rector cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !cancelled() }}
        with:
          path: |
            /tmp/rector
            /tmp/rector-runner
          key: ${{ runner.os }}-rector-${{ github.run_id }}

      - name: Type coverage
        run: composer test:type-coverage
