name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    # The Laravel app's behaviour suite: Pest Arch/Unit/Http plus the Vitest unit suite
    # (`composer test:unit`). Lint, static analysis and type coverage run as their own
    # workflows (lint.yml, static.yml) so a formatting nit and a real failure are separate
    # red checks.
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup app
        uses: ./.github/actions/setup-app
        with:
          coverage: xdebug

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Point HERD_BIN at this runner's PHP
        run: echo "HERD_BIN=$(dirname "$(which php)")" >> "$GITHUB_ENV"

      - name: Point HERD_NVM_EXEC at this runner's Node
        run: echo "HERD_NVM_EXEC=$(which env)" >> "$GITHUB_ENV"

      - name: Resolve tinkerbench.test to localhost
        run: echo "127.0.0.1 tinkerbench.test" | sudo tee -a /etc/hosts

      - name: Generate a self-signed certificate for tinkerbench.test
        # tests/Unit/Support/LanguageServer/* boot the real language-server-bridge.mjs, which
        # reads tinkerbench.test's certificate; TINKERBENCH_HERD_CERTIFICATES_DIR points it here.
        run: |
          mkdir -p /tmp/tinkerbench-certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj "/CN=tinkerbench.test" \
            -keyout /tmp/tinkerbench-certs/tinkerbench.test.key \
            -out /tmp/tinkerbench-certs/tinkerbench.test.crt
          echo "TINKERBENCH_HERD_CERTIFICATES_DIR=/tmp/tinkerbench-certs" >> "$GITHUB_ENV"

      - name: App tests
        run: composer test:unit

  runner:
    # packages/runner declares php: ^8.2 — it has to run on a target project's
    # Laravel-12-supported PHP, not tinkerbench's own ^8.5. The 8.5 cell runs the full
    # `composer test` (100% line-coverage gate); the 8.2 cell runs `composer test:php82`,
    # which drops only that gate: SnippetRunnerTest's tinkerbench-as-target group self-skips
    # under 8.2 (tinkerbench itself needs 8.5+), so 100% is unreachable there. Everything
    # else still has to parse and pass on a real 8.2 interpreter.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        php: ['8.5', '8.2']
        include:
          - php: '8.5'
            script: test
            coverage: xdebug
          - php: '8.2'
            script: test:php82
            coverage: none

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: ${{ matrix.coverage }}

      - name: Cache packages/runner Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/runner/vendor
          key: ${{ runner.os }}-composer-runner-${{ matrix.php }}-${{ hashFiles('packages/runner/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-runner-${{ matrix.php }}-

      - name: Cache Laravel 12 fixture Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/runner/tests/fixtures/laravel-12/vendor
          key: ${{ runner.os }}-composer-fixture-laravel12-${{ matrix.php }}-${{ hashFiles('packages/runner/tests/fixtures/laravel-12/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-fixture-laravel12-${{ matrix.php }}-

      - name: Install packages/runner Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-progress --working-dir=packages/runner

      - name: Install runner test-fixture Composer dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress --working-dir=packages/runner/tests/fixtures/plain-composer-php
          composer install --no-interaction --prefer-dist --no-progress --working-dir=packages/runner/tests/fixtures/laravel-12

      - name: Runner tests
        run: composer ${{ matrix.script }} --working-dir=packages/runner

  browser:
    # Real-browser tests via pest-plugin-browser + headless Chromium. The suite fakes every
    # external process (Herd, the LSP bridges) in tests/Browser/Pest.php, so this job needs
    # no Herd binary, no tinkerbench.test host entry and no certificate, just built assets
    # and a browser.
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup app
        uses: ./.github/actions/setup-app

      - name: Cache packages/runner Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/runner/vendor
          key: ${{ runner.os }}-composer-runner-8.5-${{ hashFiles('packages/runner/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-runner-8.5-

      - name: Install packages/runner Composer dependencies
        # SnippetRunner spawns packages/runner/bin/run-snippet.php in its own PHP process; it
        # requires the package's own vendor/autoload.php, so the run-snippet journeys need it.
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-progress --working-dir=packages/runner

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Prepare the SQLite database
        # The run-snippet journey executes real snippets against this app as the target
        # project; one of them runs a `select 1` through the app's own database connection.
        run: |
          touch database/database.sqlite
          php artisan migrate --force

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        # Runs without --retry: a browser test that only passes on a re-run is a defect to
        # fix or delete (.ai/rules/browser.md).
        run: composer test:browser

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-screenshots
          path: tests/Browser/Screenshots/
          if-no-files-found: ignore
          retention-days: 7
