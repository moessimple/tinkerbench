name: static analysis

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    # `composer test:types`: PHPStan (larastan) over app/ and packages/runner, plus vue-tsc
    # over the frontend.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup app
        uses: ./.github/actions/setup-app
        with:
          build: 'false'

      - name: Cache packages/runner Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/runner/vendor
          key: ${{ runner.os }}-composer-runner-8.5-${{ hashFiles('packages/runner/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-runner-8.5-

      - name: Install packages/runner Composer dependencies
        # `composer test:types` descends into packages/runner, which runs its own PHPStan
        # binary and larastan extension from this vendor dir.
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-progress --working-dir=packages/runner

      - name: Cache PHPStan
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /tmp/phpstan
            /tmp/phpstan-runner
          key: ${{ runner.os }}-phpstan-${{ hashFiles('composer.lock', 'packages/runner/composer.lock') }}
          restore-keys: ${{ runner.os }}-phpstan-

      - name: Static analysis
        run: composer test:types
